<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Отзывы — Кенгуру</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/reviews.js" defer></script>
</head>
<body>
  <section class="reviews" id="reviews-slider" aria-label="Отзывы гостей">
    <button class="reviews__arrow reviews__arrow--prev" type="button" aria-label="Предыдущий отзыв">‹</button>
    <div class="reviews__viewport">
      <div class="reviews__track" id="reviews-track"></div>
      <p class="reviews__status" id="reviews-status">Загружаем отзывы…</p>
    </div>
    <button class="reviews__arrow reviews__arrow--next" type="button" aria-label="Следующий отзыв">›</button>
    <div class="reviews__dots" id="reviews-dots"></div>
    <a class="reviews__link" href="https://yandex.ru/maps/org/kenguru/158191390944/reviews/" target="_blank" rel="noopener noreferrer">Все отзывы на Яндекс Картах</a>
  </section>
</body>
</html>
